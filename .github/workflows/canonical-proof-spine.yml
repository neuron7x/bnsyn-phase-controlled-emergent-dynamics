name: canonical-proof-spine

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-proof-spine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Pin pip
        uses: ./.github/actions/pin-pip

      - name: Log pip version
        run: python -m pip --version

      - name: Install
        run: python -m pip install -e ".[ci]"

      - name: Run canonical proof
        run: bnsyn run --profile canonical --plot --export-proof --output artifacts/canonical_run

      - name: Validate canonical bundle
        run: bnsyn proof-validate-bundle artifacts/canonical_run

      - name: Verify manifest/proof consistency
        run: bnsyn proof-evaluate artifacts/canonical_run

      - name: Validate determinism replay
        run: bnsyn proof-check-determinism artifacts/canonical_run

      - name: Validate 10-seed admissibility band
        run: bnsyn proof-check-envelope artifacts/canonical_run
